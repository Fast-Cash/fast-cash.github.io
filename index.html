<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fast Cash</title>

<!-- Favicon (your favicon.jpg) -->
<link rel="icon" href="favicon.jpg" type="image/jpeg" />

<!-- Google AdSense Script -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613" crossorigin="anonymous"></script>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #eef2f3;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .container {
    display: flex;
    max-width: 1250px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
  }

  /* Side ads */
  .side-ad {
    width: 160px;
    background: #e0e0e0;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Main content */
  .main {
    flex: 1;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin-top: 0;
    font-size: 2em;
    color: #333;
  }

  /* Stats */
  .stats {
    display: flex;
    align-items: center;
    margin-top: 10px;
    font-size: 1.2em;
  }

  #coinDisplay {
    font-weight: bold;
    margin-left: 10px;
    color: #2c3e50;
  }

  /* Buttons */
  button {
    margin-top: 20px;
    padding: 14px 24px;
    font-size: 1em;
    border: none;
    border-radius: 8px;
    background: #27ae60;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover {
    background: #219150;
  }

  /* Input styles */
  input[type="email"] {
    padding: 10px;
    margin-top: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
    width: 250px;
    font-size: 1em;
  }

  /* Message */
  #withdrawMsg {
    margin-top: 15px;
    font-weight: bold;
    font-size: 1.1em;
  }

  /* Responsive */
  @media(max-width: 768px) {
    .container {
      flex-direction: column;
    }
    .side-ad {
      width: 100%;
    }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Left Ad -->
  <div class="side-ad" id="leftAd">
    <ins class="adsbygoogle"
         style="display:block; width:160px; height:600px;"
         data-ad-client="ca-pub-4335653991954613"
         data-ad-slot="1234567890"></ins>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>Earn & Withdraw Money</h1>
    <div class="stats">
      <div>Your Coins: </div>
      <div id="coinDisplay">0</div>
    </div>
    <button id="watchAdBtn">Watch Ad (+5 coins)</button>

    <div style="margin-top:30px; width:100%; max-width:500px;">
      <h2>Withdraw Funds</h2>
      <p>Minimum withdrawal is $5.00 (250 cents). Your total earned: <span id="totalEarnedDisplay">$0.00</span></p>
      
      <input type="email" id="emailInput" placeholder="Enter your PayPal email" />
      
      <button id="withdrawBtn">Withdraw</button>
      
      <div id="withdrawMsg"></div>
    </div>

    <!-- Additional info -->
    <div class="fallback-spot" style="margin-top:30px; padding:15px; background:#f9f9f9; border-radius:8px; border:1px dashed #ccc;">
      <p>Additional info or ads can go here.</p>
    </div>
  </div>

  <!-- Right Ad -->
  <div class="side-ad" id="rightAd">
    <ins class="adsbygoogle"
         style="display:block; width:160px; height:600px;"
         data-ad-client="ca-pub-4335653991954613"
         data-ad-slot="0987654321"></ins>
  </div>
</div>

<script>
  // Load ads
  (adsbygoogle = window.adsbygoogle || []).push({});

  let coins = 0;
  let totalCentsEarned = 0;

  function updateDisplay() {
    document.getElementById('coinDisplay').innerText = coins;
    document.getElementById('totalEarnedDisplay').innerText = `$${(totalCentsEarned / 100).toFixed(2)}`;
  }

  // Watch ad - adds 5 coins and 2 cents
  document.getElementById('watchAdBtn').addEventListener('click', () => {
    coins += 5;
    totalCentsEarned += 2;  // 5 coins = 2 cents
    updateDisplay();
  });

  // Withdraw
 document.getElementById('withdrawBtn').addEventListener('click', () => {
    if (totalCentsEarned >= 250) { // $5 minimum
      const amountCents = totalCentsEarned;
      const amountDollars = (amountCents / 100).toFixed(2);
      const email = document.getElementById('emailInput').value.trim();

      if (!email || !validateEmail(email)) {
        document.getElementById('withdrawMsg').innerHTML = 'Please enter a valid email.';
        return;
      }

      // Reset
      totalCentsEarned = 0;
      coins = 0;
      updateDisplay();

      // Show success message
      document.getElementById('withdrawMsg').innerHTML = `$${amountDollars} sent to ${email} via PayPal or card.`;
      
      // Here you would connect to your payment API to process payout
    } else {
      document.getElementById('withdrawMsg').innerText = 'Minimum withdrawal is $5.00. Keep earning!';
    }
  });

  function validateEmail(email) {
    const re = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
    return re.test(email);
  }
</script>

</body>
</html>
